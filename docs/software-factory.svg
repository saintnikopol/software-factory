<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 545" width="1420" height="545"
     role="img" aria-labelledby="sfTitle sfDesc">
  <title id="sfTitle">The software factory lifecycle</title>
  <desc id="sfDesc">Eight stages in sequence — intake, design, dispatch, execution,
  review, gates, release, reflection — with the four principal artefacts of each.
  Reflection closes the loop by feeding two return paths: new process rules into the
  standing law that constrains dispatch through gates, and new engineering work back
  into the roadmap graph at intake. A tighter loop above the gates stage turns each
  incident into a new mechanical check.</desc>

  <style>
    svg {
      --ground:    #F2F1EE;
      --surface:   #FBFAF8;
      --surface-2: #E8E6E1;
      --ink:       #17191C;
      --ink-2:     #4A4E54;
      --ink-3:     #7C8087;
      --rule:      #D6D3CC;
      --rule-hard: #B6B2A9;
      --accent:    #B87A08;
      --rust:      #9C3A24;
      --steel:     #35636A;

      --display: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --ground:    #101215;
        --surface:   #181B1F;
        --surface-2: #22262B;
        --ink:       #E9E7E2;
        --ink-2:     #ABAFB5;
        --ink-3:     #767B82;
        --rule:      #2C3137;
        --rule-hard: #414750;
        --accent:    #E5A62F;
        --rust:      #D9705A;
        --steel:     #79B0B4;
      }
    }

    .sf-bg    { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
    .sf-box   { fill: var(--surface); stroke: var(--rule-hard); stroke-width: 1; }
    .sf-num   { font-family: var(--display); font-weight: 800; font-size: 14px; }
    .sf-ttl   { font-family: var(--display); font-weight: 700; font-size: 15px;
                fill: var(--ink); letter-spacing: -0.01em; }
    .sf-sub   { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); }
    .sf-op    { font-family: var(--mono); font-size: 8px; font-weight: 500;
                letter-spacing: 0.03em; }
    .sf-canl  { font-family: var(--display); font-weight: 700; font-size: 9.5px;
                letter-spacing: 0.14em; fill: var(--ink-3); }
    .sf-canv  { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
    .sf-canr  { stroke: var(--rule); stroke-width: 1; }
    .sf-chip  { fill: var(--ground); stroke: var(--rule); stroke-width: 1; }
    .sf-chipt { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-2); }
    .sf-flow  { stroke: var(--ink-3); stroke-width: 1.4; fill: none; }
    .sf-law   { fill: var(--surface-2); stroke: var(--rust); stroke-width: 1; }
    .sf-lawl  { font-family: var(--display); font-weight: 700; font-size: 10px;
                letter-spacing: 0.14em; fill: var(--rust); }
    .sf-lawt  { font-family: var(--mono); font-size: 10px; fill: var(--ink-2); }
    .sf-ret   { fill: none; stroke-width: 1.6; }
    .sf-retl  { font-family: var(--mono); font-size: 10px; font-weight: 500;
                letter-spacing: 0.04em; }
    .sf-legt  { font-family: var(--mono); font-size: 10px; fill: var(--ink-2); }
    .sf-thesis{ font-family: var(--display); font-weight: 700; font-size: 12px; fill: var(--ink); }
    .sf-human { fill: var(--rust); }
    .sf-agent { fill: var(--accent); }
    .sf-mach  { fill: var(--steel); }
    .sf-s-human { stroke: var(--rust); }
    .sf-s-agent { stroke: var(--accent); }
    .sf-s-mach  { stroke: var(--steel); }
    .sf-mk-ink   { fill: var(--ink-3); }
    .sf-mk-agent { fill: var(--accent); }
    .sf-mk-human { fill: var(--rust); }
    .sf-mk-mach  { fill: var(--steel); }
  </style>

